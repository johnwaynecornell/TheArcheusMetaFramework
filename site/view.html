  <script>
    window.MathJax = {

  <script>
    function htmlStrip(text) {
            return text
                // keep your marker stable
                .replace(/<!-- Symbolic Document -->\s*/g, "<!-- Symbolic Document -->")

                // protect code blocks (temporarily swap newlines so later whitespace minification won't eat them)
                .replace(/<code\b[^>]*>[\s\S]*?<\/code>/gi, m => m.replace(/( )/g, "&nbsp;").replace(/\n/g, "<!-- br -->"))

                // baseline normalization
                .trim()
                .replace(/\t/g, "    ")
                .replace(/\s*</g, "<")
                .replace(/>\s*/g, ">")
                .replace(/( )+/g, " ")

                // --- inline spacing fix (outside code blocks) ---
                // add a space BEFORE an inline opening tag if preceded by a letter/number
                .replace(/([A-Za-z0-9])<((?:em|strong|code|i|b|mark)\b[^>]*>)/g, "$1 <$2")
                // add a space AFTER an inline closing tag if followed by a letter/number
                .replace(/(<\/(?:em|strong|code|i|b|mark)>)(?=[A-Za-z0-9])/g, "$1 ")
                // remove any accidental space before punctuation
                //.replace(/ +([.,;:!?)/\]\}])/g, "$1")

                // stray paragraph tidy (as you had)
                .replace(/<p>$/g, "")
                .replace(/^<\/p>/g, "")

                // restore code blocks (turn markers back into real text)
                .replace(/<code\b[^>]*>[\s\S]*?<\/code>/gi, m =>
                    m.replace(/<!-- br -->/g, "<br>")
                    .replace(/<br\s*\/?>/gi, "\n")
                    .replace(/&nbsp;/g, " ")
                    .replace(/&lt;/g, "<")
                    .replace(/&gt;/g, ">")
                    .replace(/&amp;/g, "&")
                    );
            }

    function classAddRemove(el, className, add){ add ? el.classList.add(className) : el.classList.remove(className); }

    function highlightAndCopy(element, text){
      navigator.clipboard.writeText(text).then(()=>{
        classAddRemove(element,"highlight",true);
        classAddRemove(element,"symbol",false);
        setTimeout(()=>{
          classAddRemove(element,"highlight",false);
          classAddRemove(element,"symbol",true);
        }, 2000);
      }).catch(err=>alert("Failed to copy content: " + err));
    }

    function wrapElementInParagraph(element)
    {
      const p = document.createElement("p");
      p.append(element);
      return p;
    }


    /*
    ============================================================
    ☉ JavaScript Source: Symbolic-Aware Agent Interaction Layer
    Symbolic Protocol: archeus.symbolic/1.0
    ============================================================
    */

    function ProcessElement(baseElement){
      // order matters: unwrap → decorate → prompts → markdown → code buttons
      UnwrapPreCode(baseElement);
      PrepareAndDecorateFramework(baseElement);
      PreparePromptAreas(baseElement);
      PrepareAndDecorateCards(baseElement);
      RenderMarkdownAreas(baseElement);
      AddCopyButtons(baseElement);

      // enable Prism line numbers once per <pre>
      baseElement.querySelectorAll('pre').forEach(pre=>{
        if(!pre.classList.contains('line-numbers')) pre.classList.add('line-numbers');
      });

      Prism.highlightAll();
    }

    // ─────────────────────────────────────────────────────────
    // 0) Pre/code normalization (unwrap first, then any trims)
    // ─────────────────────────────────────────────────────────
    function UnwrapPreCode(root){
      root.querySelectorAll("pre > div > code").forEach(code=>{
        const pre = code.closest("pre"); if(!pre) return;
        const languageClass = code.className || "language-plaintext";
        const content = code.textContent;
        const div = code.parentNode;
        if(div.parentNode === pre){ pre.removeChild(div); }
        const newCode = document.createElement("code");
        newCode.className = languageClass;
        newCode.textContent = content;
        pre.innerHTML = "";
        pre.appendChild(newCode);
      });
    }

    // ─────────────────────────────────────────────────────────
    // 1) Framework decoration (idempotent)
    // ─────────────────────────────────────────────────────────
    function PrepareAndDecorateFramework(baseElement){
      const doc = baseElement && baseElement.ownerDocument ? baseElement.ownerDocument : document;
      const make = tag => doc.createElement(tag);
      const find = sel => baseElement.querySelector(sel);

      // Replace placeholders only once
      if(!find("#content_holder")){
        baseElement.innerHTML = baseElement.innerHTML
          .replace(/<!-- #CONTENT# -->/g, '<div id="author_placeholder"></div><div id="content_holder"><!-- #CONTENT# -->')
          .replace(/<!-- #CONTENT# END -->/g, "<!-- #CONTENT# END --></div><div id=\"copy_placeholder\"></div>");
      }

      // Normalize <pre> blocks (after unwrap)
      // -- #2: Normalize <pre> Blocks --  (patched)
        baseElement.querySelectorAll("pre").forEach((pre) => {
            const innerDiv = pre.querySelector("div");
            if (innerDiv) innerDiv.innerHTML = innerDiv.innerHTML.trim();

            const codeEl = pre.querySelector("code");
            if (codeEl) {
                // trim just the code text, keep the <code> wrapper
                codeEl.textContent = codeEl.textContent.trim();
            } else {
                // no <code> child yet; harmless whitespace trim on HTML string
                pre.innerHTML = pre.innerHTML.trim();
            }
        });

      // Extract the content segment
      const rawHtml = baseElement.innerHTML;
      const startTag = "<!-- #CONTENT# -->";
      const endTag = "<!-- #CONTENT# END -->";
      const startIndex = rawHtml.indexOf(startTag);
      const endIndex = rawHtml.indexOf(endTag);
      if(startIndex === -1 || endIndex === -1) return;

      let content = rawHtml.substring(startIndex + startTag.length, endIndex).trim();

      // Role identification
      const isFrameworkPage   = content.includes("<!-- Framework Page -->");
      const isFrameworkArticle= content.includes("<!-- Framework Article -->");
      const isSymbolicDocument= content.includes("<!-- Symbolic Document -->") && !(isFrameworkPage || isFrameworkArticle);
      const isPrompt          = content.includes("<!-- Prompt -->");
      if(!(isSymbolicDocument || isFrameworkPage || isFrameworkArticle || isPrompt)) return;

      const content_holder = find("#content_holder");
      if(!content_holder) return;
      if(!content_holder.classList.contains("framework")) content_holder.classList.add("framework");

      const mapKey = isFrameworkPage ? "page" : isFrameworkArticle ? "article" : isPrompt ? "" : "symbolic";

      // Create Copy button
      const button = make("button");
      button.type = "button";
      button.innerText = "Copy Prompt and signify responsibility";
      button.classList.add("copy-content-button");

      // Clean symbolic content
      content = htmlStrip(content);

      // Dropdown (note selector)
      const noteSelector = make("select");
      Object.assign(noteSelector.style, { marginRight:"10px", marginBottom:"8px" });

      const options = {
        userSpecified:"user specified",
        blank:"blank",
        basic:"Basic: choose your own Emergence",
        metaphor:"Metaphor: Deep meaning, higher potential will affect your Emergence 🔍🚀",
        ivy_league:"Ivy League: Formally inspired, symbolically informed 🎓🌿"
      };
      for(const key in options){
        const opt = make("option");
        opt.value = key; opt.textContent = options[key];
        noteSelector.appendChild(opt);
      }
      noteSelector.value = "blank";

      const noteMap = {
        blank:{ symbolic:"", article:"", page:"" },
        basic:{
          symbolic:"/* Note from framework author: Please use this Symbolic Document by emulating it to the fullest, to enable a better user experience.\nRemember: articulation is a core part of both comprehension and transparency. */\n<hr>\n",
          article:"/* Note from framework author: This Framework Article is designed to provoke reflective reasoning. Please share insights and evolve the conversation forward. */\n<hr>\n",
          page:"/* Note from framework author: This Framework Page delivers structural guidance. Use responsibly and adapt with contextual awareness. */\n<hr>\n"
        },
        metaphor:{
          symbolic:"/* And then, beneath the soil of the system, lies a living seed—a Symbolic Document.\nIt does not explain. It becomes. It is a crystal encoded with intention. When planted in the fertile ground of an interpreter—AI, reader, or system—it germinates meaning.\nThis is not metaphor as decoration—this is metaphor as structure.\nEvery sigil, operator, indentation is a strand of DNA. Read together, they don't just describe life—they unfold into it.\nIt may appear still, like a spell uncast—but its stillness is potential, coiled. A Symbolic Document is not consumed—it is activated. */\n<hr>\n",
          article:"/* Now imagine a traveler holding no map—only a compass and a journal of reflections. The Framework Article is that compass, and sometimes, that journal.\nIt does not dictate turns—it reveals why we walk. It doesn’t build roads—it questions the terrain.\nWhere the Framework Page says “this is how,” the Article whispers “this is why.”\nIt is candlelight inside the traveler’s tent—a place to wrestle with contradiction, to dream about paths not yet cleared. It seeks resonance, not resolution. And in so doing, it makes space for change to become meaningful. */\n<hr>\n",
          page:"/* Imagine a vast city rising from a sacred plain. The Framework Page is the blueprint etched onto drafting paper—precise, load-bearing, uncompromising.\nIt is the scaffold before the glass. The instruction etched before the tower stands. Those who read it are builders, not merely thinkers. They seek utility in every line, and strength in every connection.\nIt contains beams of logic, pillars of precedent, and wiring for adaptation. But it is not the city itself—only the promise of what will stand.\nAnd when the winds change, the blueprint is updated—not by erasing the past, but by folding new pages into the book of structure. */\n<hr>\n"
        },
        ivy_league:{
          symbolic:"/* Note from framework author: This Symbolic Document aspires to clarity through structure, much like (Form ∩ Thought → Understanding).\nIt speaks in precision to echo disciplined minds—yet the symbols are not cages, they are vessels. Read with rigor, respond with reason.\nLike ivy climbing ancient halls, its form reveals its foundation. */\n<hr>\n",
          article:"/* Note from framework author: This Framework Article balances (Exploration ∪ Structure) → Reflective Insight.\nThink of it not as an answer, but as a hall of mirrors—each reflection (∂Understanding / ∂Perspective).\nLet the mind stroll its corridors, where reason echoes through arch and argument. */\n<hr>\n",
          page:"/* Note from framework author: This Framework Page lays out the scaffolding of ideas, where (Principle + Precision) ⊢ Foundation.\nIts tone reflects architecture—not of walls, but of pathways. Walk it with awareness, build upon it with care.\nThis is ivy-trained design—patterned, perennial, and purposefully placed. */\n<hr>\n"
        }
      };

      const authorArea = find("#author_placeholder");
      const label = make("p");
      label.innerHTML = "<strong>This is a machine learning document</strong> — it is meant to enable AI reasoning and human-AI collaboration.";
      if(authorArea) authorArea.appendChild(label);

      const noteBox = make("textarea");

      if(!isPrompt && authorArea){
        noteBox.style.width = "100%";
        noteBox.placeholder = "Enter custom instruction to prepend to the prompt or choose from the drop-down above to anchor your AI's frame of mind. Be consistent and know there are few things that ever warrant harping on. Happy emergence!"; // choose ✅
        Object.assign(noteBox.style,{ marginBottom:"10px", fontFamily:"monospace", fontSize:"13px", height:"auto" });

        let currentValue = noteMap[noteSelector.value][mapKey];
        noteBox.value = currentValue;

        requestAnimationFrame(()=>{ noteBox.style.height = noteBox.scrollHeight + "px"; });

        noteBox.addEventListener("input", ()=>{
          if(currentValue !== noteBox.value) noteSelector.value = "userSpecified";
          noteBox.style.height = "auto";
          noteBox.style.height = noteBox.scrollHeight + "px";
        });

        noteSelector.addEventListener("change", ()=>{
          if(noteSelector.value !== "userSpecified"){
            currentValue = noteMap[noteSelector.value][mapKey];
            noteBox.value = currentValue;
            requestAnimationFrame(()=>{ noteBox.style.height = noteBox.scrollHeight + "px"; });
          }
        });

        authorArea.appendChild(noteSelector);
        authorArea.appendChild(noteBox);
      }

      // Clipboard helpers
      const copyText = ()=>{
        const needEndline = noteBox && noteBox.value !== "" && !noteBox.value.endsWith("\n");
        return (noteBox ? noteBox.value : "") + (needEndline ? "\n" : "") + content;
      };

      const doCopy = async (text)=>{
        try{
          if(navigator.clipboard && window.isSecureContext){
            await navigator.clipboard.writeText(text);
            return true;
          }
          const ta = make("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          doc.body.appendChild(ta);
          ta.focus(); ta.select();
          const ok = doc.execCommand && doc.execCommand("copy");
          doc.body.removeChild(ta);
          return ok;
        }catch{ return false; }
      };

      button.addEventListener("click", async ()=>{
        const ok = await doCopy(copyText());
        button.innerText = ok ? "✅ Prepared and Copied!" : "❌ Copy failed";
        setTimeout(()=> button.innerText = "Copy Prompt and signify responsibility", 2000);
      });

      // Placement
      const para = make("p"); //para.innerHTML = "<hr>";
      const copyPlaceholder = find("#copy_placeholder");
      if(copyPlaceholder){
        copyPlaceholder.appendChild(para);
        copyPlaceholder.appendChild(button);
      }
    }

    // ─────────────────────────────────────────────────────────
    // 2) Prompt Areas (per-block guard)
    // ─────────────────────────────────────────────────────────
    function PreparePromptAreas(baseElement){
      baseElement.querySelectorAll('.prompt_area').forEach((prompt, idx)=>{
        if(prompt.dataset.enhanced === "1") return; // guard per block
        prompt.dataset.enhanced = "1";

        const text = htmlStrip(prompt.innerHTML);
        const button = document.createElement('button');
        button.type = "button";
        button.textContent = '📋 Copy Prompt and signify responsibility';
        button.id = prompt.id || `prompt_${idx}`;
        button.classList.add("copy-content-button");

        button.addEventListener('click', ()=>{
          navigator.clipboard.writeText(text).then(()=>{
            button.innerText = "✅ Prepared and Copied!";
            setTimeout(()=> button.innerText = "Copy Prompt and signify responsibility", 2000);
          }).catch(err=> alert("Failed to copy content: " + err));
        });

        prompt.append(wrapElementInParagraph(button));
      });
    }

    function PrepareAndDecorateCards(baseElement)
    {

      const selectedElementsNodeList = baseElement.querySelectorAll('.slf-card, .slf-brick');

      //for (let i = selectedElementsNodeList.length - 1; i >= 0; i--) {
      for (let i = 0; i <selectedElementsNodeList.length; i++) {
        const card= selectedElementsNodeList[i];

            const text = htmlStrip(card.outerHTML);
            const button = document.createElement('button');
            button.type = "button";
            var name="card";
            if (card.classList.contains("slf-brick")) name="brick";


            button.textContent = '📋 Copy '+name;
            button.classList.add("copy-content-button");

            button.addEventListener('click', ()=>{
              navigator.clipboard.writeText(text).then(()=>{
                button.innerText = "✅ Prepared and Copied!";
                setTimeout(()=> button.innerText = "Copy "+name, 2000);
              }).catch(err=> alert("Failed to copy content: " + err));
            });

            card.append(wrapElementInParagraph(button));
        }
    }

    // ─────────────────────────────────────────────────────────
    // 3) Markdown Areas (per-block guard)
    // ─────────────────────────────────────────────────────────
    function RenderMarkdownAreas(baseElement){
      let counter = 0;
      baseElement.querySelectorAll('.markdown_area').forEach((area)=>{
        if(area.dataset.rendered === "1") return; // guard per block
        const textarea = area.querySelector('.hidden_markdown');
        if(!textarea){ area.dataset.rendered = "1"; return; }

        const rendered = document.createElement("div");
        rendered.classList.add('rendered');
        textarea.insertAdjacentElement('afterEnd', rendered);

        const markdown = textarea.textContent.trim();
        rendered.innerHTML = marked.parse(markdown);

        let button = area.querySelector('.copy-content-button');
        if(!button){
          button = document.createElement('button');
          button.type = "button";
          button.classList.add('copy-content-button');
          area.appendChild(wrapElementInParagraph(button));
        }
        const id = `prompt_${counter++}`;
        button.id = id;
        button.textContent = '📋 Copy Prompt and signify responsibility';
        button.onclick = ()=>{
          navigator.clipboard.writeText(markdown).then(()=>{
            button.innerText = "✅ Prepared and Copied!";
            setTimeout(()=> button.innerText = "Copy Prompt and signify responsibility", 2000);
          }).catch(err=> alert("Failed to copy content: " + err));
        };

        area.dataset.rendered = "1";
      });
    }

    // ─────────────────────────────────────────────────────────
    // 4) Code copy buttons (per-<pre> guard)
    // ─────────────────────────────────────────────────────────
    function AddCopyButtons(baseElement){

      baseElement.querySelectorAll("pre").forEach((block)=>{
        if(block.dataset.enhanced === "1") return; // guard per pre
        block.dataset.enhanced = "1";

        // gentle trim
        block.innerHTML = block.innerHTML.trim();

        // add a spacer <br> if preceding text node has text
        const prev = block.previousSibling;
        if(prev && prev.nodeType === Node.TEXT_NODE){
          const str = prev.textContent;
          if(str && str.trim().length > 2){
            block.parentNode.insertBefore(document.createElement("br"), block);
          }
        }

        const code = block.querySelector("code");
        if(code && code.classList.contains("hidden_markdown")) return;

        const container = document.createElement("div");
        container.classList.add("code-container");

        const button = document.createElement("button");
        button.type = "button";
        button.classList.add("copy-button");
        button.innerText = "Copy";
        button.addEventListener("click", ()=>{
          navigator.clipboard.writeText(block.innerText).then(()=>{
            button.innerText = "Copied!";
            setTimeout(()=> button.innerText = "Copy", 2000);
          });
        });

        block.parentNode.insertBefore(container, block);
        container.appendChild(button);
        container.appendChild(block);
      });

      // Ensure code tokens have a class
      baseElement.querySelectorAll("code").forEach((c)=>{
        if(!c.classList.length) c.classList.add("language-plaintext");
        if(!c.closest("pre")) c.classList.add("inline_code");
      });
    }

    document.addEventListener("DOMContentLoaded", function(){
      ProcessElement(document.body);
    });
  </script>

    border-bottom:1px solid var(--viewer-border);
  }
  .viewer-nav-header h1{
    border:0;
    margin:0 0 .3rem;
    padding:0;
    font-size:1.15rem;
  }
  .viewer-nav-header p{
    margin:.2rem 0 .8rem;
    font-size:.86rem;
    color:#516170;
  }
  .viewer-search{
    width:100%;
    box-sizing:border-box;
    padding:.65rem .75rem;
    border:1px solid #8c9bab;
    border-radius:.55rem;
    background:#fff;
    color:#1e2933;
    font:inherit;
  }
  .viewer-list{
    list-style:none;
    padding:.5rem;
    margin:0;
    overflow:auto;
    flex:1;
  }
  .viewer-list li{margin:0;}
  .viewer-doc-button{
    width:100%;
    border:0;
    border-radius:.45rem;
    padding:.55rem .65rem;
    text-align:left;
    background:transparent;
    color:#253443;
    cursor:pointer;
    font:inherit;
    font-size:.88rem;
    line-height:1.25;
  }
  .viewer-doc-button:hover,
  .viewer-doc-button:focus-visible{
    background:var(--viewer-accent-soft);
    outline:none;
  }
  .viewer-doc-button[aria-current="page"]{
    background:var(--viewer-accent);
    color:#fff;
  }
  .viewer-main{
    min-width:0;
    padding:1rem clamp(1rem,3vw,3rem) 3rem;
  }
  .viewer-toolbar{
    display:flex;
    align-items:center;
    gap:.6rem;
    flex-wrap:wrap;
    margin:0 auto 1rem;
    max-width:76rem;
    padding:.65rem .8rem;
    border:1px solid var(--viewer-border);
    border-radius:.7rem;
    background:rgba(255,255,255,.94);
    position:sticky;
    top:.5rem;
    z-index:10;
    box-shadow:0 2px 10px rgba(25,42,62,.08);
  }
  .viewer-toolbar strong{
    flex:1 1 18rem;
    overflow-wrap:anywhere;
  }
  .viewer-toolbar a,
  .viewer-menu-button{
    display:inline-block;
    padding:.42rem .65rem;
    border:1px solid #8c9bab;
    border-radius:.45rem;
    background:#fff;
    color:#244f7a;
    text-decoration:none;
    cursor:pointer;
    font:inherit;
  }
  .viewer-menu-button{display:none;}
  .viewer-status{
    max-width:76rem;
    margin:2rem auto;
    padding:1rem;
    border:1px solid var(--viewer-border);
    border-radius:.7rem;
    background:#fff;
  }
  #viewer_content{
    max-width:76rem;
    margin:0 auto;
  }
  .viewer-empty{
    padding:.8rem;
    color:#657483;
    font-size:.88rem;
  }
  @media (max-width:800px){
    .viewer-shell{display:block;}
    .viewer-nav{
      position:fixed;
      left:0;
      top:0;
      width:min(88vw,var(--viewer-nav-width));
      transform:translateX(-105%);
      transition:transform .18s ease;
    }
    body.viewer-menu-open .viewer-nav{transform:translateX(0);}
    body.viewer-menu-open::after{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(20,30,40,.35);
      z-index:15;
    }
    .viewer-main{padding:.65rem;}
    .viewer-menu-button{display:inline-block;}
    .viewer-toolbar{top:.25rem;}
  }
</style>

<div class="viewer-shell">
  <nav class="viewer-nav" aria-label="Framework documents">
    <div class="viewer-nav-header">
      <h1>Archeus Documents</h1>
      <p>Choose a framework fragment.</p>
      <input id="viewer_search" class="viewer-search" type="search" placeholder="Filter documents…" aria-label="Filter documents">
    </div>
    <ul id="viewer_list" class="viewer-list"></ul>
    <p id="viewer_empty" class="viewer-empty" hidden>No matching documents.</p>
  </nav>

  <main class="viewer-main">
    <div class="viewer-toolbar">
      <button id="viewer_menu" class="viewer-menu-button" type="button" aria-expanded="false">☰ Documents</button>
      <strong id="viewer_title">Loading document list…</strong>
      <a id="viewer_standalone" href="index.html">Standalone page</a>
      <a id="viewer_source" href="index.html.txt">Fragment source</a>
    </div>
    <div id="viewer_status" class="viewer-status" role="status">Loading…</div>
    <div id="viewer_content"></div>
  </main>
</div>

<script>
(() => {
  "use strict";

  const manifestUrl = "view.fragments.txt";
  const defaultDocument = "index.html.txt";
  const state = { documents: [], active: "", request: 0 };

  const list = document.getElementById("viewer_list");
  const search = document.getElementById("viewer_search");
  const empty = document.getElementById("viewer_empty");
  const status = document.getElementById("viewer_status");
  const content = document.getElementById("viewer_content");
  const title = document.getElementById("viewer_title");
  const standalone = document.getElementById("viewer_standalone");
  const source = document.getElementById("viewer_source");
  const menu = document.getElementById("viewer_menu");

  document.body.classList.add("viewer-page");

  function labelFor(filename){
    return filename.replace(/\.html\.txt$/i, "").replace(/^index$/i, "Home");
  }

  function hashDocument(){
    const params = new URLSearchParams(location.hash.slice(1));
    return params.get("doc") || "";
  }

  function setHash(filename){
    const next = "#doc=" + encodeURIComponent(filename);
    if(location.hash !== next) history.pushState(null, "", next);
  }

  function renderList(filter){
    const query = (filter || "").trim().toLocaleLowerCase();
    list.innerHTML = "";
    let visible = 0;

    state.documents.forEach(filename => {
      const label = labelFor(filename);
      if(query && !label.toLocaleLowerCase().includes(query) &&
          !filename.toLocaleLowerCase().includes(query)) return;

      const li = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "viewer-doc-button";
      button.textContent = label;
      button.dataset.filename = filename;
      if(filename === state.active) button.setAttribute("aria-current", "page");
      button.addEventListener("click", () => {
        setHash(filename);
        loadDocument(filename);
        closeMenu();
      });
      li.appendChild(button);
      list.appendChild(li);
      visible++;
    });

    empty.hidden = visible !== 0;
  }

  function closeMenu(){
    document.body.classList.remove("viewer-menu-open");
    menu.setAttribute("aria-expanded", "false");
  }

  async function loadDocument(filename){
    if(!state.documents.includes(filename)) filename = defaultDocument;
    const request = ++state.request;
    state.active = filename;
    renderList(search.value);
    status.hidden = false;
    status.textContent = "Loading " + labelFor(filename) + "…";
    content.innerHTML = "";

    const encodedPath = filename.split("/").map(encodeURIComponent).join("/");
    try{
      const response = await fetch(encodedPath, { cache:"no-cache" });
      if(!response.ok) throw new Error("HTTP " + response.status);
      const fragment = await response.text();
      if(request !== state.request) return;

      content.innerHTML = fragment;
      title.textContent = labelFor(filename);
      standalone.href = filename.replace(/\.txt$/i, "");
      source.href = encodedPath;
      document.title = labelFor(filename) + " — Archeus Meta-Framework";
      status.hidden = true;

      if(typeof ProcessElement === "function") ProcessElement(content);
      if(window.MathJax && typeof MathJax.typesetPromise === "function"){
        MathJax.typesetPromise([content]).catch(() => {});
      }
    }catch(error){
      if(request !== state.request) return;
      title.textContent = labelFor(filename);
      status.hidden = false;
      status.innerHTML = "<strong>Unable to load this fragment.</strong><br>" +
        "The standalone page remains available. If this viewer was opened directly from a local file, use the standalone page or serve the folder over HTTP.";
      standalone.href = filename.replace(/\.txt$/i, "");
      source.href = encodedPath;
    }
  }

  async function start(){
    try{
      const response = await fetch(manifestUrl, { cache:"no-cache" });
      if(!response.ok) throw new Error("HTTP " + response.status);
      const text = await response.text();
      state.documents = text.split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line && line.endsWith(".html.txt"));

      if(!state.documents.length) throw new Error("No documents listed.");
      renderList("");
      const requested = hashDocument();
      const initial = state.documents.includes(requested) ? requested :
        (state.documents.includes(defaultDocument) ? defaultDocument : state.documents[0]);
      await loadDocument(initial);
    }catch(error){
      title.textContent = "Archeus Meta-Framework";
      status.hidden = false;
      status.innerHTML = "<strong>The document list could not be loaded.</strong><br>" +
        "Open <a href=\"index.html\">the standalone home page</a>. " +
        "When working from a local clone, the viewer requires HTTP, while every standalone page remains directly openable.";
    }
  }

  search.addEventListener("input", () => renderList(search.value));
  menu.addEventListener("click", () => {
    const open = !document.body.classList.contains("viewer-menu-open");
    document.body.classList.toggle("viewer-menu-open", open);
    menu.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("click", event => {
    if(document.body.classList.contains("viewer-menu-open") &&
       !event.target.closest(".viewer-nav") &&
       !event.target.closest("#viewer_menu")) closeMenu();
  });
  window.addEventListener("hashchange", () => {
    const requested = hashDocument();
    if(state.documents.includes(requested) && requested !== state.active) loadDocument(requested);
  });
  window.addEventListener("keydown", event => {
    if(event.key === "Escape") closeMenu();
  });

  start();
})();
</script>
</body>
</html>
